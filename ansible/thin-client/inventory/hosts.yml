# Inventory: which machines exist and how to reach them.
# The inventory hostname (tc-05) becomes the machine's future hostname:
# the base role sets hostname = inventory_hostname. A separate NEW_HOSTNAME
# variable (as in the bash script) is no longer needed.
---
thin_clients:
  hosts:
    tc-05:
      # IP Ansible uses to reach the machine over SSH RIGHT NOW.
      # On first provisioning this is the laptop's LAN address; once the
      # tunnel is up you can switch it to the WG address.
      ansible_host: 192.0.2.55
  vars:
    # Which SSH user to connect as (must be able to sudo).
    # Run: ansible-playbook site.yml -K   (-K prompts for the sudo password)
    ansible_user: adams
