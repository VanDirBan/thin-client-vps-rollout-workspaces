# ansible.cfg — project-local config (Ansible reads it from the current directory)
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# Don't create .retry files
retry_files_enabled = False
# Show diff of changed files with --diff (handy together with --check)
# stdout_callback = yaml   # uncomment if you want more readable output

[privilege_escalation]
become = True
become_method = sudo
