# Role node_exporter: metrics for Prometheus on the admin node, only via wg0.
# Binding to the specific wg IP instead of 0.0.0.0: the port doesn't exist on
# the outside at all; the killswitch is a second layer, not the only one.
# Until the tunnel is up the bind fails — systemd retries every 5s (same
# scheme as x11vnc).
---
- name: node_exporter (the whole block is skipped when node_exporter_enable=false)
  when: node_exporter_enable
  block:
    # --no-install-recommends: without the *-collectors package (smartmon/apt
    # cron jobs) — add them later deliberately if needed.
    - name: Install prometheus-node-exporter (no recommends)
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present
        install_recommends: false

    # Package config: arguments via /etc/default (the Debian scheme).
    - name: /etc/default/prometheus-node-exporter — bind to the wg address only
      ansible.builtin.template:
        src: prometheus-node-exporter.default.j2
        dest: /etc/default/prometheus-node-exporter
        mode: '0644'
        backup: true
      notify: Restart node_exporter

    - name: Drop-in directory for the unit
      ansible.builtin.file:
        path: /etc/systemd/system/prometheus-node-exporter.service.d
        state: directory
        mode: '0755'

    # Endless bind retries until wg-watchdog brings the tunnel up.
    - name: Drop-in — retry forever (wg0 may come up later than us on boot)
      ansible.builtin.copy:
        src: override.conf
        dest: /etc/systemd/system/prometheus-node-exporter.service.d/override.conf
        mode: '0644'
      notify: Restart node_exporter

    - name: Enable node_exporter on boot
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        enabled: true
        daemon_reload: true

    - name: Where to verify from the admin node
      ansible.builtin.debug:
        msg: >-
          node_exporter listens on
          {{ wg_client_addr | split('/') | first }}:{{ node_exporter_port }}
          (wg0 only). Check from the admin node:
          curl http://{{ wg_client_addr | split('/') | first }}:{{ node_exporter_port }}/metrics
