# Managed by Ansible (role audio)
# Onboard Realtek: initial profile is analog duplex, otherwise PipeWire may
# come up output-only and the system will have no audio sources at all.
# Match on alsa.mixer_name, not the PCI path: survives slot/model changes.
monitor.alsa.rules = [
  {
    matches = [ { alsa.mixer_name = "~Realtek.*" } ]
    actions = { update-props = { device.profile = "output:analog-stereo+input:analog-stereo" } }
  }
]
