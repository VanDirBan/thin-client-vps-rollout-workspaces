---
# vps-provision Ansible v2.3.2 — port of vps-provision.sh v2.3
#   XFCE + NoMachine + Firefox + MLX + Telegram + Teams + WireGuard (client)
#   + audio tunnel to the thin client + node_exporter (wg-only) + no-lock
#   Users: adams (admin), smm (work)
#
# Full run (root passwords come from vault_root_pass):
#   ansible-playbook site.yml --ask-vault-pass
#
# Selected steps (after a failure / to finish a single section):
#   ansible-playbook site.yml --ask-vault-pass --tags nomachine,display
#
# Dry run against a live reference machine:
#   ansible-playbook site.yml --ask-vault-pass --check --diff --limit vps-199
#
# Roles run in playbook order regardless of how tags are listed on the
# command line — same as the canonical STEPS order in the shell version.
# The preflight role is tagged 'always' and runs every time.
#
# The playbook is idempotent: a re-run does not break what is already done.

- name: Provision a work VPS (XFCE + NoMachine + Firefox + MLX + Telegram + Teams + WG client)
  hosts: vps
  become: true
  gather_facts: false

  pre_tasks:
    # Public repository safety: real passwords live in ignored encrypted vault.yml.
    - name: Pre-check — required secrets and inventory values were replaced
      ansible.builtin.assert:
        that:
          - >-
            (ansible_user | default('root')) != 'root' or
            (
              (vault_root_pass | default({})) is mapping and
              inventory_hostname in (vault_root_pass | default({})) and
              ((vault_root_pass | default({})).get(inventory_hostname, '') | length) > 0 and
              not ((vault_root_pass | default({})).get(inventory_hostname, '') is match('^CHANGE_ME_'))
            )
          - vault_admin_pass | default('') | length > 0
          - vault_admin_pass | default('') != 'CHANGE_ME_STRONG_ADMIN_PASSWORD'
          - vault_work_pass | default('') | length > 0
          - vault_work_pass | default('') != 'CHANGE_ME_STRONG_WORK_PASSWORD'
          - ansible_host | default('') != '203.0.113.10'
          - wg_address | default('') is match('^\d+\.\d+\.\d+\.\d+/\d+$')
          - >-
            ((wg_server_pubkey | default('') | length) == 0 and
             (wg_server_endpoint | default('') | length) == 0) or
            ((wg_server_pubkey | default('') | length) > 0 and
             (wg_server_endpoint | default('') | length) > 0)
        fail_msg: >-
          Replace the public placeholders before running: copy
          group_vars/vps/vault.yml.example to ignored vault.yml, set the
          per-host root password plus real user passwords there, update
          inventory/hosts.yml with a real VPS address, and either leave both
          WireGuard server values empty or set both.
          Set audio_laptop_ip per host only when the paired thin client is ready.
      tags: [always]

    - name: Gather facts after local safety checks
      ansible.builtin.setup:
      tags: [always]

  environment:
    DEBIAN_FRONTEND: noninteractive
    NEEDRESTART_MODE: a
  roles:
    - { role: preflight, tags: always }
    - { role: base,      tags: base }
    - { role: desktop,   tags: desktop }
    - { role: users,     tags: users }
    - { role: firefox,   tags: firefox }
    - { role: telegram,      tags: telegram }
    - { role: teams,         tags: teams }
    - { role: wireguard,     tags: wireguard }
    - { role: nomachine,     tags: nomachine }
    - { role: audio,         tags: audio }
    - { role: mlx,           tags: mlx }
    - { role: node_exporter, tags: node_exporter }
    - { role: display,       tags: display }
    - { role: nolock,        tags: nolock }
    - { role: shortcuts,     tags: shortcuts }
    - { role: summary,       tags: summary }
