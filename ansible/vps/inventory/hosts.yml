---
# One entry per VPS. wg_address is per-host: the VPS range is 10.77.77.101-200.
#
# First run on a fresh VPS — connect as root with a password:
#   ansible-playbook site.yml -k --ask-vault-pass
# (`-k` prompts for the SSH password; requires `sshpass` on the admin laptop)
all:
  children:
    vps:
      hosts:
        vps-199:
          ansible_host: 203.0.113.10        # public IP of the VPS
          wg_address: "10.77.77.199/24"     # this VPS's address in the tunnel net
      vars:
        ansible_user: root
