---
# One entry per VPS. wg_address is per-host: the VPS range is 10.77.77.101-200.
#
# The root SSH password of each VPS lives in group_vars/vps/vault.yml under
# vault_root_pass, keyed by the inventory hostname below. No -k is needed:
#   ansible-playbook site.yml --ask-vault-pass
# Password-based SSH still requires sshpass on the admin laptop.
all:
  children:
    vps:
      hosts:
        vps-199:
          ansible_host: 203.0.113.10        # public IP of the VPS
          wg_address: "10.77.77.199/32"     # this VPS's address in the tunnel net
          audio_laptop_ip: ""                  # wg address of the PAIRED laptop, e.g. 10.77.77.6; empty = no audio tunnel
      vars:
        ansible_user: root
